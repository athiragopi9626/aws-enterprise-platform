
name: Terraform CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: environments/primary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive ../../

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    needs: validate

    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false

    runs-on: ubuntu-latest
    environment: primary-plan
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: environments/primary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
        run: |
          test -n "$EXPECTED_ACCOUNT"
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)
          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT"

      - name: Initialize S3 backend
        run: |
          terraform init \
            -input=false \
            -lock-timeout=5m \
            -backend-config=backend.config

 
      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode \
            -no-color \
            -out=tfplan

          EXIT_CODE=$?
          set -e

          case "$EXIT_CODE" in
            0)
              echo "status=no-changes" >> "$GITHUB_OUTPUT"
              echo "Terraform plan succeeded: no changes."
              ;;
            2)
              echo "status=changes" >> "$GITHUB_OUTPUT"
              echo "Terraform plan succeeded: changes detected."
              ;;
            *)
              echo "::error::Terraform plan failed with exit code $EXIT_CODE"
              exit 1
              ;;
          esac

