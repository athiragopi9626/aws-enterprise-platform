
name: Terraform Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: primary-deployment
  cancel-in-progress: false

jobs:
  terraform-deploy:
    name: Build Image and Deploy Infrastructure
    runs-on: ubuntu-latest

    # Reuse the existing GitHub environment.
    # Approval is required only once for this job.
    environment: primary-deploy

    defaults:
      run:
        working-directory: environments/primary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reuse the existing Terraform deployment IAM role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT"

      # Authenticate Docker using the same AWS role.
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build the application and publish an immutable image.
      - name: Build and Push Docker Image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: aep-primary-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Avoid pushing the same immutable tag twice.
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            >/dev/null 2>&1; then

            echo "Image already exists: $IMAGE_URI"
          else
            docker build --pull \
              -t "$IMAGE_URI" \
              ../../app

            docker push "$IMAGE_URI"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init
        run: terraform init -backend-config=backend.config -input=false

      - name: Terraform Validate
        run: terraform validate

      # Terraform uses the image published above.
      - name: Terraform Destroy Plan
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan

      - name: Terraform Apply
        run: terraform apply -input=false destroy.tfplan
