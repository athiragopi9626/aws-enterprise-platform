name: Terraform Deploy
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'environments/primary/**'
      - '.github/workflows/terraform-*.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-primary-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Approved Terraform plan and apply
    runs-on: ubuntu-latest
    environment: primary-deploy
    timeout-minutes: 45
    defaults:
      run:
        working-directory: environments/primary
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-primary-${{ github.run_id }}
      - name: Confirm AWS account
        run: |
          test -n "${{ vars.EXPECTED_AWS_ACCOUNT_ID }}"
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL" = "${{ vars.EXPECTED_AWS_ACCOUNT_ID }}"
      - name: Terraform format
        run: terraform fmt -check -recursive ../../
      - name: Terraform init (existing S3 backend)
        run: terraform init -input=false -backend-config=backend.config -lock-timeout=5m
      - name: Terraform validate
        run: terraform validate -no-color
      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Apply exactly the reviewed-run plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
